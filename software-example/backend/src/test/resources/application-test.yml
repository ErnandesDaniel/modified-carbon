# Test configuration
spring:
  datasource:
    url: jdbc:tc:postgresql:15:///testdb
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: snowflake-arctic-embed:335m

# JWT configuration for tests
jwt:
  secret: test-secret-key-for-jwt-signing-in-tests-only-do-not-use-in-production
  expiration: 86400000

# Service auth configuration
service:
  auth:
    login:
      secret: test-secret-key

# Logging
logging:
  level:
    root: WARN
    ru.main.back: DEBUG
