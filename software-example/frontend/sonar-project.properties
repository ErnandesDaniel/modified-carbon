# SonarQube Configuration for Frontend
sonar.projectKey=notes-ai-frontend
sonar.projectName=Notes AI Frontend
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Test files
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# TypeScript/JavaScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage report path (will be generated by jest or similar)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate requirements
# Coverage scope is aligned with the tested code (vitest coverage.include = src/components/**).
# Code outside this scope is still analyzed for bugs/vulnerabilities, only excluded from coverage %.
sonar.coverage.exclusions=src/app/**,src/api/**,src/lib/**,src/modules/**,src/test/**,src/components/providers/mock-provider/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/types.ts,**/*.d.ts
