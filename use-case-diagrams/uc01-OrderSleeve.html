<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>UC-01 OrderSleeve</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #f0f2f5;
  color: rgba(0,0,0,.88);
  font: 14px/1.5715 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 32px;
  display: flex;
  justify-content: center;
}
.app { width: 1120px; background: #f5f5f5; border-radius: 8px; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04); }
.topbar { height: 56px; background: #fff; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.brand { font-size: 15px; font-weight: 600; }
.brand small { display: block; color: rgba(0,0,0,.45); font-size: 11px; font-weight: 400; }
.role { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(0,0,0,.65); }
.page-header { padding: 20px 24px 0; }
.page-header h1 { margin: 0; font-size: 18px; font-weight: 600; }
.content { padding: 16px 24px 24px; }
.card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 1px 6px -1px rgba(0,0,0,.02), 0 2px 4px rgba(0,0,0,.02); }
.filters { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field .label { font-size: 14px; }
input[type=text] { height: 32px; padding: 4px 11px; border: 1px solid #d9d9d9; border-radius: 6px; font: inherit; font-size: 14px; color: rgba(0,0,0,.88); background: #fff; width: 110px; }
input[type=text]:focus { outline: none; border-color: #722ed1; box-shadow: 0 0 0 2px rgba(114,46,209,.12); }
.radios { display: flex; gap: 14px; align-items: center; height: 32px; }
.radios label { display: flex; align-items: center; gap: 6px; }
input[type=radio] { accent-color: #722ed1; width: 16px; height: 16px; margin: 0; }
.btn { height: 32px; padding: 4px 15px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; color: rgba(0,0,0,.88); font: inherit; font-size: 14px; display: inline-flex; align-items: center; }
.btn-primary { background: #722ed1; border-color: #722ed1; color: #fff; }
.btn-sm { height: 24px; padding: 0 7px; font-size: 12px; }
.table { border: 1px solid #f0f0f0; border-radius: 8px; overflow: hidden; margin-top: 20px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th { background: #fafafa; text-align: left; font-weight: 600; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
tbody td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
tbody tr:last-child td { border-bottom: none; }
.tag { display: inline-block; padding: 0 7px; font-size: 12px; line-height: 20px; border-radius: 4px; border: 1px solid transparent; }
.tag-default { background: #fafafa; border-color: #d9d9d9; }
.tag-success { background: #f6ffed; border-color: #b7eb8f; color: #52c41a; }
.tag-purple { background: #f9f0ff; border-color: #d3adf7; color: #722ed1; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">SCMS<small>Sleeving Clinic Management System</small></div>
    <div class="role"><span class="tag tag-purple">Meth</span> M. Kovacs</div>
  </header>
  <div class="page-header"><h1>Каталог тел</h1></div>
  <main class="content">
    <div class="card">
      <div class="filters">
        <div class="field"><span class="label">Рост, см</span><input type="text" value="172"></div>
        <div class="field"><span class="label">Вес, кг</span><input type="text" value="58"></div>
        <div class="field"><span class="label">Возраст</span><input type="text" value="24–32"></div>
        <div class="field">
          <span class="label">Пол</span>
          <div class="radios">
            <label><input type="radio" name="sex" checked> Любой</label>
            <label><input type="radio" name="sex"> М</label>
            <label><input type="radio" name="sex"> Ж</label>
          </div>
        </div>
        <button class="btn btn-primary">Найти</button>
      </div>

      <div class="table">
        <table>
          <thead>
            <tr><th>ID</th><th>Пол</th><th>Рост</th><th>Вес</th><th>Возраст</th><th>Статус</th><th>Действие</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>SLV-042</td><td>Ж</td><td>172</td><td>58</td><td>26</td>
              <td><span class="tag tag-success">Доступно</span></td>
              <td><button class="btn btn-primary btn-sm">Заказать</button></td>
            </tr>
            <tr>
              <td>SLV-117</td><td>М</td><td>185</td><td>80</td><td>31</td>
              <td><span class="tag tag-success">Доступно</span></td>
              <td><button class="btn btn-primary btn-sm">Заказать</button></td>
            </tr>
            <tr>
              <td>SLV-203</td><td>Ж</td><td>168</td><td>55</td><td>24</td>
              <td><span class="tag tag-default">Зарезервировано</span></td>
              <td><button class="btn btn-sm">Подробнее</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
</body>
</html>
