<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>UC-05 RegisterMeth · Личный кабинет клиента</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #f0f2f5;
  color: rgba(0,0,0,.88);
  font: 14px/1.5715 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 32px;
  display: flex;
  justify-content: center;
}
.app { width: 1120px; background: #f5f5f5; border-radius: 8px; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04); }
.topbar { height: 56px; background: #fff; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.brand { font-size: 15px; font-weight: 600; }
.brand small { display: block; color: rgba(0,0,0,.45); font-size: 11px; font-weight: 400; }
.role { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(0,0,0,.65); }
.page-header { padding: 20px 24px 0; }
.page-header h1 { margin: 0; font-size: 18px; font-weight: 600; }
.content { padding: 16px 24px 32px; display: flex; justify-content: center; }
.card { width: 480px; background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 1px 6px -1px rgba(0,0,0,.02), 0 2px 4px rgba(0,0,0,.02); }
.account { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #f0f0f0; border-radius: 8px; background: #fafafa; }
.account .avatar { width: 40px; height: 40px; border-radius: 50%; background: #f9f0ff; border: 1px solid #d3adf7; color: #722ed1; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.account .who { font-weight: 600; }
.account .mail { color: rgba(0,0,0,.45); font-size: 12px; }
.alert { display: flex; gap: 10px; padding: 10px 14px; border-radius: 8px; border: 1px solid; font-size: 13px; margin: 20px 0; }
.alert-success { background: #f6ffed; border-color: #b7eb8f; color: #389e0d; }
.btn { height: 36px; padding: 0 16px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; color: rgba(0,0,0,.88); font: inherit; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
.btn-primary { background: #722ed1; border-color: #722ed1; color: #fff; }
.btn-block { width: 100%; }
.tag { display: inline-block; padding: 0 7px; font-size: 12px; line-height: 20px; border-radius: 4px; border: 1px solid transparent; }
.tag-purple { background: #f9f0ff; border-color: #d3adf7; color: #722ed1; }
.mainnav { height: 44px; background: #fff; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 2px; padding: 0 24px; font-size: 14px; }
.mainnav a { color: rgba(0,0,0,.65); text-decoration: none; padding: 0 12px; height: 44px; display: inline-flex; align-items: center; border-bottom: 2px solid transparent; }
.mainnav a.active { color: #722ed1; border-bottom-color: #722ed1; font-weight: 500; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">SCMS<small>Sleeving Clinic Management System</small></div>
    <div class="role"><span class="tag tag-purple">Meth</span> M. Kovacs</div>
  </header>
  <nav class="mainnav">
    <a href="#" class="active">Личный кабинет</a>
    <a href="#">Каталог тел</a>
    <a href="#">Мои заказы</a>
    <a href="#">Документы</a>
  </nav>
  <div class="page-header"><h1>Личный кабинет</h1></div>
  <main class="content">
    <div class="card">
      <div class="account">
        <div class="avatar">MK</div>
        <div>
          <div class="who">M. Kovacs</div>
          <div class="mail">m.kovacs@gmail.com · Google</div>
        </div>
      </div>

      <div class="alert alert-success">Учётная запись и личный кабинет созданы. Доступен каталог тел для оформления заказа.</div>

      <button class="btn btn-primary btn-block">Перейти в каталог тел</button>
    </div>
  </main>
</div>
</body>
</html>
