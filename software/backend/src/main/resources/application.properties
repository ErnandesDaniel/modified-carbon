# 0. Import .env (ищем в корне backend/ и на уровень выше)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# 1. DB settings for application (app_user)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${APP_DB_USERNAME}
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. DB settings for Liquibase migrations (admin user)
spring.liquibase.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.liquibase.user=${ADMIN_DB_USERNAME}
spring.liquibase.password=${ADMIN_DB_PASSWORD}
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.parameters.db.app.user=${APP_DB_USERNAME}

# 3. JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# 4. Server
server.port=${APP_PORT}
server.servlet.context-path=/api
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
springdoc.swagger-ui.path=/swagger

# 5. JWT (httpOnly cookie)
jwt.secret=${AUTH_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# 6. Frontend redirect + cookies
app.frontend-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.cookie.secure=${COOKIE_SECURE:false}

# 7. OAuth2 clients
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com
spring.security.oauth2.client.provider.google.user-name-attribute=sub
