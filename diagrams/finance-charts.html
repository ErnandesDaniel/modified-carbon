<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SCMS — график окупаемости</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: #f0f2f5;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: rgba(0,0,0,.88);
    user-select: none;
  }
  .chart {
    width: 1040px; background: #fff; border-radius: 8px; padding: 20px 24px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 1px 6px -1px rgba(0,0,0,.02), 0 2px 4px rgba(0,0,0,.02);
    margin-bottom: 24px;
  }
  .chart h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .chart .sub { color: rgba(0,0,0,.45); font-size: 12px; margin-bottom: 8px; }
  svg { display: block; }
</style>
</head>
<body>
  <div class="chart" id="payback">
    <h2>Накопленный денежный поток — точка окупаемости</h2>
    <div class="sub">Кредиты · оси: месяцы проекта (февраль 2026 — декабрь 2027)</div>
  </div>

<script>
  const MONTHS = ['Фев 26','Мар 26','Апр 26','Май 26','Июн 26','Июл 26','Авг 26','Сен 26','Окт 26','Ноя 26','Дек 26',
                  'Янв 27','Фев 27','Мар 27','Апр 27','Май 27','Июн 27','Июл 27','Авг 27','Сен 27','Окт 27','Ноя 27','Дек 27'];
  const CUM = [-952000,-1278500,-1605000,-1931500,-2258000,-2258000,-2258000,-2939500,-3621000,-4302500,-6000000,
               -5009000,-4018000,-3027000,-2036000,-1045000,-54000,937000,1928000,2919000,3910000,4901000,5892000];

  const fmt = n => {
    const s = Math.abs(n).toLocaleString('ru-RU').replace(/\u00A0/g,' ');
    return (n < 0 ? '−' : '') + s;
  };

  function svgEl(tag, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function drawPayback(container) {
    const W = 992, H = 460, m = { top: 20, right: 24, bottom: 56, left: 96 };
    const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
    const yMin = -7000000, yMax = 6000000;
    const n = CUM.length;
    const x = i => m.left + (iw * i) / (n - 1);
    const y = v => m.top + ih * (yMax - v) / (yMax - yMin);

    const svg = svgEl('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` });

    for (let v = -7e6; v <= 6e6; v += 1e6) {
      svg.appendChild(svgEl('line', { x1: m.left, x2: W - m.right, y1: y(v), y2: y(v), stroke: v === 0 ? '#d9d9d9' : '#f0f0f0', 'stroke-width': v === 0 ? 1.5 : 1 }));
      const t = svgEl('text', { x: m.left - 10, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'rgba(0,0,0,.45)' });
      t.textContent = fmt(v / 1000) + ' тыс.';
      svg.appendChild(t);
    }

    for (let i = 0; i < n; i += 2) {
      const t = svgEl('text', { x: x(i), y: H - m.bottom + 20, 'text-anchor': 'middle', 'font-size': 11, fill: 'rgba(0,0,0,.45)' });
      t.textContent = MONTHS[i];
      svg.appendChild(t);
      svg.appendChild(svgEl('line', { x1: x(i), x2: x(i), y1: m.top, y2: m.top + ih, stroke: '#fafafa' }));
    }

    let d = `M ${x(0)} ${y(CUM[0])}`;
    for (let i = 1; i < n; i++) d += ` L ${x(i)} ${y(CUM[i - 1])} L ${x(i)} ${y(CUM[i])}`;
    svg.appendChild(svgEl('path', { d, fill: 'none', stroke: '#722ed1', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }));

    const frac = 54000 / 991000;
    const bx = x(16) + (x(17) - x(16)) * frac;
    const by = y(0);
    svg.appendChild(svgEl('line', { x1: bx, x2: bx, y1: m.top, y2: by, stroke: '#52c41a', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }));
    svg.appendChild(svgEl('circle', { cx: bx, cy: by, r: 5, fill: '#52c41a' }));
    const lbl = svgEl('text', { x: bx - 8, y: by - 12, 'text-anchor': 'end', 'font-size': 12, 'font-weight': 600, fill: '#389e0d' });
    lbl.textContent = 'Точка окупаемости ≈ 6,1 мес (июль 2027)';
    svg.appendChild(lbl);

    const lg = svgEl('g', {});
    lg.appendChild(svgEl('line', { x1: m.left, x2: m.left + 22, y1: 8, y2: 8, stroke: '#722ed1', 'stroke-width': 2.5 }));
    const lg1 = svgEl('text', { x: m.left + 30, y: 12, 'font-size': 11, fill: 'rgba(0,0,0,.65)' });
    lg1.textContent = 'накопленный денежный поток';
    lg.appendChild(lg1);
    svg.appendChild(lg);

    container.appendChild(svg);
  }

  drawPayback(document.getElementById('payback'));
</script>
</body>
</html>
